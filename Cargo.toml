[package]
name = "install-from"
version = "0.1.0"
edition = "2024"
description = "You can see where the command was installed from (macOS CLI)."
license = "MIT"
repository = "https://github.com/tominaga-h/install-from"
homepage = "https://github.com/tominaga-h/install-from"
readme = "README.md"
keywords = ["cli", "macos", "homebrew", "which", "package-manager"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "githooks/", "tasks/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
